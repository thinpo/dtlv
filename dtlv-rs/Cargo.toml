[workspace]
resolver = "2"
members = [
    "crates/dtlv-codec",
    "crates/dtlv-kv",
    "crates/dtlv-datalog",
    "crates/dtlv-search",
    "crates/dtlv-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "EPL-1.0"

[workspace.dependencies]
heed = "0.20"
tempfile = "3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
redb = "2"
